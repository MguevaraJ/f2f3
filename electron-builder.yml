appId: dev.mguevara.f2f3
# File-safe: "+" is not allowed in file names. The visible name is "F2+F3" (desktop entry, window).
productName: F2F3
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - resources/**
  - package.json
  # Browser build of the ONNX runtime is not used in Node.
  - '!node_modules/onnxruntime-web/**'
afterPack: build/afterPack.cjs
asarUnpack:
  - resources/**
  # Native runtime of the on-device model (shared libraries can't load from inside asar).
  - node_modules/onnxruntime-node/**
  - node_modules/sharp/**
  - node_modules/@img/**
linux:
  target: [AppImage, deb]
  category: Graphics
  icon: build/icon.png
  desktop:
    entry:
      Name: F2+F3
win:
  target: nsis
mac:
  target: dmg
  category: public.app-category.graphics-design
